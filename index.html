<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>repaso · Descubre 3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..700&family=Geist:wght@400..700&family=Geist+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app" data-drawer="closed">
    <aside class="side" id="side" aria-label="ajustes">
      <div class="side-head">
        <span class="brand" aria-hidden="true">repaso<span class="brand-dot"></span></span>
        <button class="close" id="close" type="button" aria-label="cerrar"></button>
      </div>

      <fieldset class="group" id="book">
        <legend class="group-h">libro</legend>
      </fieldset>

      <fieldset class="group group-grow" id="types">
        <legend class="group-h">tipo de verbo</legend>
      </fieldset>

      <div class="ex-groups" id="ex-groups"></div>

      <div class="side-foot">
        <label class="switch">
          <input class="switch-input" id="vos" type="checkbox" role="switch">
          <span class="switch-label">vosotros</span>
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        </label>
        <label class="switch">
          <input class="switch-input" id="strict" type="checkbox" role="switch">
          <span class="switch-label">acentos estrictos</span>
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
        </label>
        <p class="pool" id="pool" aria-live="polite"></p>
      </div>
    </aside>

    <div class="scrim" id="scrim" aria-hidden="true"></div>

    <main class="main" id="main">
      <header class="bar">
        <button class="menu" id="menu" type="button" aria-label="ajustes" aria-controls="side" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
        </button>
        <div class="modes" id="modes" role="tablist" aria-label="modo">
          <span class="modes-ink" id="modes-ink" aria-hidden="true"></span>
        </div>
        <div class="stats">
          <div class="stat stat-streak" id="streak-box" title="racha">
            <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.2 1-3.6 2.2-4.6.2 1.6 1 2.6 2.3 3C11 9 10.8 6 12 3z"/></svg>
            <output id="streak" aria-label="racha"></output>
            <output class="stat-best" id="best" aria-label="mejor racha" hidden></output>
          </div>
          <div class="stat" title="acierto">
            <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></svg>
            <output class="acc" id="acc" aria-label="acierto"></output>
          </div>
          <div class="stat" title="respuestas">
            <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7"/></svg>
            <output id="count" aria-label="respuestas"></output>
          </div>
        </div>
      </header>

      <div class="ambient" id="ambient" aria-hidden="true"></div>

      <section class="stage" id="stage" data-mode="asking" data-kind="drill" role="tabpanel">
        <div class="card" id="card">
          <p class="meta">
            <span class="person" id="person"></span>
            <span class="hint" id="hint" hidden></span>
            <span class="flag" id="flag" hidden></span>
          </p>
          <h1 class="verb" id="verb" lang="es"></h1>
          <p class="prompt" id="prompt" lang="es"></p>
          <p class="gloss" id="gloss" lang="en"></p>

          <div class="choices" id="choices" role="group" tabindex="-1"></div>

          <form class="answer" id="form" autocomplete="off" novalidate>
            <div class="field" id="field">
              <input class="answer-input" id="input" type="text" inputmode="text" enterkeyhint="go"
                     autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"
                     lang="es" aria-label="forma conjugada">
              <span class="echo" id="echo" aria-hidden="true"></span>
              <button class="submit" id="submit" type="submit" aria-label="comprobar" data-mark="arrow"></button>
            </div>
          </form>

          <p class="nudge" id="nudge" lang="es" hidden></p>

          <div class="fix" id="fix" hidden>
            <div class="fix-text">
              <span class="right" id="right" lang="es"></span>
              <span class="why" id="why" lang="es"></span>
            </div>
            <button class="next" id="next" type="button" aria-label="siguiente"></button>
          </div>

          <div class="keys" id="keys"></div>
          <button class="empty" id="empty" type="button" aria-controls="side" hidden></button>
        </div>
        <div class="burst" id="burst" aria-hidden="true"></div>
        <section class="conj" id="conj" hidden></section>
      </section>

      <section class="read" id="read" role="tabpanel" hidden></section>
    </main>
  </div>
  <p class="sr" id="live" role="status" aria-live="polite"></p>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" integrity="sha384-g4NTh/Iv5PPU4xPyhEWqPcwtNXOvdaDI8LLnyYfyNZOjKJeYQyjzQ9X5275eBjpt" crossorigin="anonymous"></script>
  <script src="js/core/normalize.js"></script>
  <script src="js/core/tenses.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/core/scheduler.js"></script>
  <script src="js/core/session.js"></script>
  <script src="js/core/guard.js"></script>
  <script src="js/core/deck.js"></script>
  <script src="js/core/lessons.js"></script>
  <script src="js/core/conjugate.js"></script>
  <script src="js/data/verb.js"></script>
  <script src="js/tenses/present.js"></script>
  <script src="js/data/verbs-irregular.js"></script>
  <script src="js/data/verbs-stem.js"></script>
  <script src="js/data/verbs-spelling.js"></script>
  <script src="js/data/verbs-reflexive.js"></script>
  <script src="js/data/verbs-regular.js"></script>
  <script src="js/data/verbs-descubre.js"></script>
  <script src="js/data/descubre.js"></script>
  <script src="js/data/l2-vocab.js"></script>
  <script src="js/data/l2-pronouns.js"></script>
  <script src="js/data/l2-gustar.js"></script>
  <script src="js/data/l2-readings.js"></script>
  <script src="js/data/l2-reflexives.js"></script>
  <script src="js/data/l2.js"></script>
  <script src="js/data/lessons/d1.js"></script>
  <script src="js/data/lessons/d2.js"></script>
  <script src="js/data/lessons/d3-1.js"></script>
  <script src="js/data/lessons/d3-3.js"></script>
  <script src="js/data/lessons/general.js"></script>
  <script src="js/ui/motion.js"></script>
  <script src="js/ui/reading.js"></script>
  <script src="js/ui/app.js"></script>
</body>
</html>
